name: Refresh boards

# Redraws the scoreboard and language mix from live GitHub data. Runs daily,
# and on demand from the Actions tab. If the numbers have not moved, nothing
# is committed.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/refresh-boards.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch stats
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/fetch_stats.py

      - name: Redraw boards
        run: python scripts/generate.py

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --staged --quiet; then
            echo "Numbers unchanged, nothing to commit."
          else
            git commit -m "Refresh boards"
            git push
          fi
