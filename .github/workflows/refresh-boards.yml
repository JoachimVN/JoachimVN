name: Refresh boards

# Redraws the scoreboard and language mix from live GitHub data. Runs daily,
# and on demand from the Actions tab. If the numbers have not moved, nothing
# is committed.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    # Only from main. A scripts change on a feature branch would otherwise push a
    # refresh commit onto that branch seconds after the push, which moves the head
    # while the pull request is being analysed and leaves the check cancelled.
    branches:
      - main
    paths:
      - "scripts/**"
      - ".github/workflows/refresh-boards.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Checking out with the PAT means the refresh commit is pushed by a real
          # user rather than github-actions[bot]. A public repo has its scheduled
          # workflows disabled after 60 days with no repository activity, and bot
          # pushes are widely reported not to count. The commit author below stays
          # the bot, so these refreshes never count toward the commit figure.
          # No loop: the push trigger above only watches scripts/** and this file,
          # and a refresh only touches assets/**. Keep that filter.
          token: ${{ secrets.STATS_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch stats
        env:
          # github.token cannot see private repos, so the counts would drop by
          # whatever is private. STATS_TOKEN is a personal access token with repo
          # scope; without it fetch_stats.py refuses to write smaller numbers.
          GH_TOKEN: ${{ secrets.STATS_TOKEN || github.token }}
        run: python scripts/fetch_stats.py

      - name: Redraw boards
        run: python scripts/generate.py

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --staged --quiet; then
            echo "Numbers unchanged, nothing to commit."
          else
            git commit -m "Refresh boards"
            git push
          fi
